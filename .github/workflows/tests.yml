name: Tests

on:
  push:
    branches: [main]
    paths: ['gate.py', 'ci_run.py', 'publish.py', 'spacepipe/**', 'tests/**', '.github/workflows/tests.yml', 'requirements.txt', 'kokoro_models.sha256']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: System packages (same ffmpeg as the post workflow)
        timeout-minutes: 8           # a stuck apt mirror once hung this step 20 minutes (chess, 2026-10-26)
        run: |
          for try in 1 2; do
            sudo timeout 180 apt-get update -qq && sudo timeout 180 apt-get install -y -qq ffmpeg && exit 0
            echo "apt attempt $try failed or timed out"
          done
          exit 1

      - run: pip install -r requirements.txt

      - name: Cache the narrator voice
        uses: actions/cache@v6
        with:
          path: kokoro_models
          key: kokoro-v1.0

      - name: Narrator voice (Kokoro bm_george; public model files, hash-checked)
        timeout-minutes: 6
        # Never fails the run: without the files every edit renders music-only and the Telegram preview says NARRATION FAILED.
        run: |
          mkdir -p kokoro_models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -f "kokoro_models/$f" ] || curl -fsSL --retry 4 --retry-delay 5 -o "kokoro_models/$f" "$base/$f" || echo "::warning::could not download $f"
          done
          sha256sum -c kokoro_models.sha256 || { echo "::warning::narrator model files missing or wrong hash: no narration this run"; rm -f kokoro_models/*; }

      - name: Gate, QC, slot and pruning tests
        run: python -m unittest discover -s tests -v
