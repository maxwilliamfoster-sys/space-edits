name: Tests

on:
  push:
    branches: [main]
    paths: ['gate.py', 'ci_run.py', 'publish.py', 'spacepipe/**', 'tests/**', '.github/workflows/tests.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: System packages (same ffmpeg as the post workflow)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pip install -r requirements.txt

      - name: Gate, QC, slot and pruning tests
        run: python -m unittest discover -s tests -v
