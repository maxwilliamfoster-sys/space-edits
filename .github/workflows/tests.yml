name: Tests

on:
  push:
    branches: [main]
    paths: ['gate.py', 'ci_run.py', 'publish.py', 'spacepipe/**', 'tests/**', '.github/workflows/tests.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: System packages (same ffmpeg as the post workflow)
        timeout-minutes: 8           # a stuck apt mirror once hung this step 20 minutes (chess, 2026-10-26)
        run: |
          for try in 1 2; do
            sudo timeout 180 apt-get update -qq && sudo timeout 180 apt-get install -y -qq ffmpeg && exit 0
            echo "apt attempt $try failed or timed out"
          done
          exit 1

      - run: pip install -r requirements.txt

      - name: Gate, QC, slot and pruning tests
        run: python -m unittest discover -s tests -v
