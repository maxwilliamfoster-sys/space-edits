name: Make and schedule space edits

on:
  schedule:
    # daily: renders, gates and previews on Telegram; also schedules on Buffer when repo variable AUTO_POST is 'true' (off = preview only).
    # Several times a day: a run only makes what is missing from Buffer's queue (QUEUE_TARGET minus waiting posts) and exits
    # at once when it is full, so a late or dropped GitHub cron is covered by the next one and the queue never runs dry.
    - cron: '23 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'edits to render this run'
        default: '10'
      now:
        description: 'true = publish immediately instead of the next slot (with post=true)'
        default: 'false'
      post:
        description: 'true = also schedule the passing edit on Buffer (manual approval)'
        default: 'false'

concurrency:
  group: space-edits
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write      # push the media branch + commit library state
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - run: pip install -r requirements.txt

      - name: Render, preview, schedule
        env:
          POST_NOW: ${{ github.event.inputs.now == 'true' && 'true' || '' }}
          AUTO_POST: ${{ (github.event.inputs.post == 'true' || (github.event_name == 'schedule' && vars.AUTO_POST == 'true')) && 'true' || '' }}
          EDITS_PER_RUN: ${{ github.event.inputs.count || vars.EDITS_PER_RUN || '10' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REQUIRE_AI: ${{ (github.event.inputs.post == 'true' || (github.event_name == 'schedule' && vars.AUTO_POST == 'true')) && '1' || '' }}   # scheduling fails closed if the AI review cannot run
          APP_URL: https://bot-hq.maxwilliamfoster.workers.dev
          APP_EVENTS_TOKEN: ${{ secrets.APP_EVENTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ci_run.py

      - name: Keep the rendered edits for a few days
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edits
          path: |
            out/queue/**/video.mp4
            out/queue/**/caption.txt
            out/queue/**/qc.json
            out/rejected/**/qc.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit library state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A library/history.json library/posted.json library/gate_log.json 2>/dev/null || git add library/history.json
          git diff --staged --quiet && exit 0
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do
            if git pull --rebase -q; then
              git push && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep 5
          done
          exit 1
