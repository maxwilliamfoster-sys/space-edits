name: Collect analytics
# Read-only: records views per post and per format in library/analytics.json. Never posts.
on:
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python analytics.py
      - name: Commit the numbers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add library/analytics.json
          git diff --staged --quiet && exit 0
          git commit -m "analytics: $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          git pull --rebase -q && git push
